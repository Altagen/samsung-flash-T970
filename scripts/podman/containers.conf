[containers]
cgroups = "disabled"
default_capabilities = [
    "CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "KILL", "NET_BIND_SERVICE",
    "SETFCAP", "SETGID", "SETPCAP", "SETUID", "SYS_CHROOT"
]
log_driver = "k8s-file"
netns = "host"
pidns = "private"
utsns = "private"
ipcns = "private"
userns = "host"

[network]
network_backend = "netavark"
default_network = "podman"
network_config_dir = "/data/podman/networks"
cni_plugin_dirs = ["/data/local/tmp/podman/cni"]

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
static_dir = "/data/podman/libpod"
tmp_dir = "/data/podman/tmp"
volume_path = "/data/podman/volumes"
network_cmd_path = "/data/local/tmp/podman/bin/slirp4netns"
conmon_path = ["/data/local/tmp/podman/lib/conmon"]
helper_binaries_dir = ["/data/local/tmp/podman/lib"]

[engine.runtimes]
crun = ["/data/local/tmp/podman/bin/crun"]
runc = ["/data/local/tmp/podman/bin/runc"]
